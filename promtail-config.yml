server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push  # use the Loki service name in Docker network

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    # Relabel Docker metadata to Loki labels
    relabel_configs:
      # Tag with container name
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: '/?(.*)'   # remove leading slash

      # Tag with Docker Compose service name (if available)
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

      # Tag with Docker Compose project name
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project

      # Tag with container image name
      - source_labels: [__meta_docker_container_image]
        target_label: image

      # Drop logs from Promtail itself (optional)
      - source_labels: [__meta_docker_container_name]
        regex: 'promtail'
        action: drop

    # Only capture stdout and stderr logs
    pipeline_stages:
      - docker: {}
