services:
  questdb:
    build:
      context: ./QuestDB
      dockerfile: Dockerfile
    container_name: questdb
    restart: always
    ports:
      - "9000:9000"   # Web UI / REST
      - "9009:9009"   # InfluxDB Line protocol
      - "8812:8812"   # Postgres wire
      - "9003:9003"   # Metrics / health
    volumes:
      - questdb-storage:/root/.questdb
    environment:
      - QDB_LOG_W_STDOUT_LEVEL=ERROR
      - QDB_LOG_W_FILE_LEVEL=ERROR
      - QDB_LOG_W_HTTP_MIN_LEVEL=ERROR
      - QDB_SHARED_WORKER_COUNT=2
      - QDB_TELEMETRY_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-v", "http://127.0.0.1:9003"]
      interval: 30s
      timeout: 4s
      start_period: 40s
      retries: 3
    networks:
      - iot-net

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: fastapi-app
    depends_on:
      questdb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - QUESTDB_HOST=questdb
      - QUESTDB_PORT=8812
    volumes:
      - ./fastapi:/app
    command: uvicorn mainapi:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - iot-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  mqtt:
    build:
      context: ./mqtt
      dockerfile: Dockerfile
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - mqtt-logs:/mosquitto/log
    networks:
      - iot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-u", "BrokerHealtcheck", "-p", "admin123"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  mqtt-log-sync:
    image: alpine:3.21
    container_name: mqtt-log-sync
    depends_on:
      - mqtt
    volumes:
      - mqtt-logs:/logs:ro
      - ./mqtt/logs:/output
    command: >
      sh -c "
      mkdir -p /output &&
      touch /output/mosquitto.log /output/stderr.log &&
      tail -F /logs/mosquitto.log > /output/mosquitto.log 2>&1 &
      tail -F /logs/stderr.log > /output/stderr.log 2>&1 &
      wait
      "
    restart: unless-stopped

  mqtt-subscriber:
    build:
      context: ./mqtt
      dockerfile: Dockerfile_client
    container_name: mqtt-subscriber
    depends_on:
      mqtt:
        condition: service_started
      fastapi:
        condition: service_healthy
    volumes:
      - ./mqtt/logs:/spdlogs
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
    networks:
      - iot-net

  # Din eksisterende Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - questdb
      - loki
    restart: unless-stopped
    networks:
      - iot-net
    
    # Loki - Log aggregation system
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - iot-net
  
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - iot-net

volumes:
  questdb-storage:
    external: true
  grafana-storage:
  mqtt-logs:
  spdlog:
  loki-data:
  grafana-data:

networks:
  iot-net:
    driver: bridge
